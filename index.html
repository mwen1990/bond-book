<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bond Book">
<meta name="theme-color" content="#0d0d0d">
<title>Bond Book</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d0d;
  --surface: #161616;
  --border: #242424;
  --accent: #e8ff47;
  --red: #ff3b3b;
  --green: #3bff8a;
  --text: #f0ede6;
  --muted: #555;
  --font-display: 'Bebas Neue', sans-serif;
  --font-body: 'DM Mono', monospace;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; -webkit-font-smoothing: antialiased; }

body::before {
  content: ''; position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 9999; opacity: 0.6;
}

.app { max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: env(safe-area-inset-top, 44px) 0 env(safe-area-inset-bottom, 34px); }

.screen { display: none; flex-direction: column; flex: 1; padding: 24px 20px; animation: fadeUp 0.3s ease; overflow-y: auto; }
.screen.active { display: flex; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* Header */
.header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
.logo { font-family: var(--font-display); font-size: 52px; line-height: 0.9; }
.logo span { color: var(--accent); }
.status-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
.status-pill.active { border-color: var(--green); color: var(--green); }

/* Status card */
.status-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.status-card-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.status-card-value { font-family: var(--font-display); font-size: 32px; letter-spacing: 0.02em; line-height: 1; }
.status-card-value.success { color: var(--green); }
.status-card-value.error { color: var(--red); }
.status-card-sub { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

/* Week cards */
.week-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.week-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; position: relative; overflow: hidden; }
.week-card.current::before { content: ''; position: absolute; inset: 0; border: 1px solid var(--accent); border-radius: 14px; pointer-events: none; }
.week-tag { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
.week-tag .current-badge { color: var(--accent); }
.week-name { font-family: var(--font-display); font-size: 28px; margin-bottom: 8px; }
.week-classes { display: flex; flex-direction: column; gap: 4px; }
.week-class-item { font-size: 11px; color: #888; }

/* Next booking banner */
.next-banner { background: rgba(232,255,71,0.06); border: 1px solid rgba(232,255,71,0.15); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.next-banner-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.next-banner-value { font-family: var(--font-display); font-size: 26px; color: var(--accent); }
.next-banner-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* Bottom nav */
.bottom-nav { display: flex; justify-content: space-around; border-top: 1px solid var(--border); padding: 16px 0 0; margin-top: auto; padding-top: 20px; }
.nav-btn { background: none; border: none; color: var(--muted); font-family: var(--font-body); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; padding: 8px 16px; border-radius: 8px; transition: color 0.15s, background 0.15s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.nav-btn.active { color: var(--accent); }
.nav-icon { font-size: 18px; }

/* Settings */
.settings-title { font-family: var(--font-display); font-size: 42px; margin-bottom: 24px; }
.field { margin-bottom: 14px; }
label { display: block; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
input, select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: var(--font-body); font-size: 14px; outline: none; transition: border-color 0.15s; -webkit-appearance: none; }
input:focus, select:focus { border-color: var(--accent); }
input::placeholder { color: #333; }

.section-sep { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 20px 0 14px; display: flex; align-items: center; gap: 10px; }
.section-sep::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* Schedule builder */
.week-section { margin-bottom: 20px; }
.week-section-title { font-family: var(--font-display); font-size: 22px; color: var(--accent); margin-bottom: 12px; }
.class-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.class-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; }
.class-row select, .class-row input { padding: 8px 10px; font-size: 12px; }
.remove-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, color 0.15s; }
.remove-btn:hover { border-color: var(--red); color: var(--red); }
.add-btn { background: none; border: 1px dashed var(--border); color: var(--muted); border-radius: 8px; padding: 10px; font-family: var(--font-body); font-size: 12px; cursor: pointer; width: 100%; transition: border-color 0.15s, color 0.15s; }
.add-btn:hover { border-color: var(--accent); color: var(--accent); }

.save-btn { width: 100%; margin-top: 20px; padding: 17px; background: var(--accent); color: var(--bg); border: none; border-radius: 12px; font-family: var(--font-display); font-size: 22px; letter-spacing: 0.04em; cursor: pointer; transition: opacity 0.15s; }
.save-btn:hover { opacity: 0.85; }
.save-msg { text-align: center; font-size: 12px; margin-top: 10px; min-height: 18px; letter-spacing: 0.04em; }
.save-msg.ok { color: var(--green); }
.save-msg.err { color: var(--red); }

.refresh-btn { width: 100%; padding: 14px; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 12px; font-family: var(--font-body); font-size: 12px; cursor: pointer; margin-top: 12px; transition: border-color 0.15s, color 0.15s; letter-spacing: 0.06em; text-transform: uppercase; }
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

@keyframes spin { to { transform: rotate(360deg); } }
.spinning { display: inline-block; animation: spin 1s linear infinite; }
</style>
</head>
<body>
<div class="app">

  <!-- HOME SCREEN -->
  <div class="screen active" id="screen-home">
    <div class="header">
      <div class="logo">BOND<br><span>BOOK</span></div>
      <div class="status-pill active" id="system-status">● AUTO</div>
    </div>

    <div id="next-banner" class="next-banner" style="display:none">
      <div class="next-banner-label">Next auto-book</div>
      <div class="next-banner-value" id="next-class-value">—</div>
      <div class="next-banner-sub" id="next-class-sub"></div>
    </div>

    <div class="status-card" id="last-booking-card">
      <div class="status-card-label">Last booking</div>
      <div class="status-card-value" id="last-booking-value">—</div>
      <div class="status-card-sub" id="last-booking-sub">No bookings yet</div>
    </div>

    <div class="week-grid">
      <div class="week-card" id="week-a-card">
        <div class="week-tag">WEEK A <span class="current-badge" id="week-a-badge" style="display:none">● NOW</span></div>
        <div class="week-name">WEEK A</div>
        <div class="week-classes" id="week-a-classes">—</div>
      </div>
      <div class="week-card" id="week-b-card">
        <div class="week-tag">WEEK B <span class="current-badge" id="week-b-badge" style="display:none">● NOW</span></div>
        <div class="week-name">WEEK B</div>
        <div class="week-classes" id="week-b-classes">—</div>
      </div>
    </div>

    <button class="refresh-btn" onclick="loadStatus()">↻ Refresh status</button>

    <div class="bottom-nav">
      <button class="nav-btn active" onclick="showScreen('home')"><span class="nav-icon">🏋️</span>Status</button>
      <button class="nav-btn" onclick="showScreen('settings')"><span class="nav-icon">⚙️</span>Settings</button>
    </div>
  </div>

  <!-- SETTINGS SCREEN -->
  <div class="screen" id="screen-settings">
    <div class="settings-title">SETUP</div>

    <div class="field">
      <label>Worker URL</label>
      <input type="url" id="worker-url" placeholder="https://old-dawn-8f14.mwengritzky.workers.dev">
    </div>

    <p class="section-sep">Credentials</p>
    <div class="field"><label>Bond Athletic Email</label><input type="email" id="cred-email" placeholder="you@email.com"></div>
    <div class="field"><label>Password</label><input type="password" id="cred-password" placeholder="••••••••"></div>
    <div class="field"><label>Notification Email</label><input type="email" id="notify-email" placeholder="email for booking confirmations"></div>
    <div class="field"><label>PIN (protects your credentials)</label><input type="password" id="cred-pin" placeholder="4+ digit PIN" maxlength="12"></div>

    <p class="section-sep">Cycle Start Date</p>
    <div class="field">
      <label>First day of Week A (so the system knows which week we're in)</label>
      <input type="date" id="cycle-start">
    </div>

    <p class="section-sep">Week A Schedule</p>
    <div class="week-section">
      <div class="class-rows" id="week-a-rows"></div>
      <button class="add-btn" onclick="addRow('a')">+ Add Week A class</button>
    </div>

    <p class="section-sep">Week B Schedule</p>
    <div class="week-section">
      <div class="class-rows" id="week-b-rows"></div>
      <button class="add-btn" onclick="addRow('b')">+ Add Week B class</button>
    </div>

    <button class="save-btn" onclick="saveConfig()">SAVE & ACTIVATE</button>
    <div class="save-msg" id="save-msg"></div>

    <div class="bottom-nav">
      <button class="nav-btn" onclick="showScreen('home')"><span class="nav-icon">🏋️</span>Status</button>
      <button class="nav-btn active" onclick="showScreen('settings')"><span class="nav-icon">⚙️</span>Settings</button>
    </div>
  </div>
</div>

<script>
const WORKER_KEY = 'bond_worker_url';
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

document.addEventListener('DOMContentLoaded', () => {
  const url = localStorage.getItem(WORKER_KEY) || '';
  document.getElementById('worker-url').value = url;
  addRow('a');
  addRow('b');
  if (url) loadStatus();
  registerSW();
});

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll(`.nav-btn[onclick*="${name}"]`).forEach(b => b.classList.add('active'));
}

// ── Status loader ──────────────────────────────────────────
async function loadStatus() {
  const url = localStorage.getItem(WORKER_KEY);
  if (!url) return;

  try {
    const res = await fetch(`${url}/get-schedule`);
    const data = await res.json();

    // Current week badge
    const isWeekA = data.currentWeek === 'A';
    document.getElementById('week-a-card').classList.toggle('current', isWeekA);
    document.getElementById('week-b-card').classList.toggle('current', !isWeekA);
    document.getElementById('week-a-badge').style.display = isWeekA ? 'inline' : 'none';
    document.getElementById('week-b-badge').style.display = !isWeekA ? 'inline' : 'none';

    // Schedule display
    if (data.schedule) {
      renderWeekClasses('week-a-classes', data.schedule.weekA || []);
      renderWeekClasses('week-b-classes', data.schedule.weekB || []);

      // Next class to be booked
      const nextWeek = isWeekA ? data.schedule.weekB : data.schedule.weekA;
      if (nextWeek && nextWeek.length > 0) {
        const next = nextWeek[0];
        document.getElementById('next-banner').style.display = 'block';
        document.getElementById('next-class-value').textContent = `${next.day.toUpperCase()} ${next.startTime}`;
        document.getElementById('next-class-sub').textContent = `Week ${isWeekA ? 'B' : 'A'} — books automatically when this week's class ends`;
      }
    }

    // Last booking
    if (data.lastBooking) {
      const lb = data.lastBooking;
      const el = document.getElementById('last-booking-value');
      el.textContent = lb.class || '—';
      el.className = 'status-card-value ' + (lb.success ? 'success' : 'error');
      document.getElementById('last-booking-sub').textContent =
        (lb.success ? '✅ Booked' : '❌ Failed') + ' · ' + new Date(lb.time).toLocaleString();
    }

  } catch(e) {
    console.error('Status load error:', e);
  }
}

function renderWeekClasses(elId, classes) {
  const el = document.getElementById(elId);
  if (!classes.length) { el.innerHTML = '<span style="color:#444;font-size:11px">No classes</span>'; return; }
  el.innerHTML = classes.map(c => `<div class="week-class-item">${c.day} ${c.startTime}</div>`).join('');
}

// ── Schedule row builder ──────────────────────────────────
function addRow(week, cls = null) {
  const container = document.getElementById(`week-${week}-rows`);
  const div = document.createElement('div');
  div.className = 'class-row';
  div.innerHTML = `
    <select class="cls-day">
      ${DAYS.map(d => `<option ${cls?.day===d?'selected':''}>${d}</option>`).join('')}
    </select>
    <input class="cls-time" type="text" placeholder="5:30 AM" value="${cls?.startTime||''}">
    <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
  `;
  container.appendChild(div);
}

function getRows(week) {
  const rows = document.querySelectorAll(`#week-${week}-rows .class-row`);
  const result = [];
  rows.forEach(row => {
    const day = row.querySelector('.cls-day').value;
    const time = row.querySelector('.cls-time').value.trim();
    if (day && time) result.push({ day, startTime: time });
  });
  return result;
}

// ── Save config ───────────────────────────────────────────
async function saveConfig() {
  const workerUrl = document.getElementById('worker-url').value.trim();
  const email     = document.getElementById('cred-email').value.trim();
  const password  = document.getElementById('cred-password').value;
  const notifyEmail = document.getElementById('notify-email').value.trim();
  const pin       = document.getElementById('cred-pin').value.trim();
  const cycleStart = document.getElementById('cycle-start').value;
  const weekA     = getRows('a');
  const weekB     = getRows('b');
  const msgEl     = document.getElementById('save-msg');

  if (!workerUrl) { showMsg('Worker URL is required', true); return; }
  if (!email || !password) { showMsg('Email and password required', true); return; }
  if (!notifyEmail) { showMsg('Notification email required', true); return; }
  if (!pin) { showMsg('PIN is required', true); return; }
  if (!weekA.length) { showMsg('Add at least one Week A class', true); return; }
  if (!weekB.length) { showMsg('Add at least one Week B class', true); return; }

  localStorage.setItem(WORKER_KEY, workerUrl);

  try {
    const res = await fetch(`${workerUrl}/save-config`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, weekA, weekB, notifyEmail, pin, cycleStartDate: cycleStart }),
    });
    const data = await res.json();
    if (data.ok) {
      showMsg('✓ Saved! Auto-booking is active.', false);
      setTimeout(() => { loadStatus(); showScreen('home'); }, 1500);
    } else {
      showMsg(data.error || 'Save failed', true);
    }
  } catch(e) {
    showMsg('Could not reach worker — check URL', true);
  }
}

function showMsg(msg, isErr) {
  const el = document.getElementById('save-msg');
  el.textContent = msg;
  el.className = 'save-msg ' + (isErr ? 'err' : 'ok');
  setTimeout(() => { el.textContent = ''; el.className = 'save-msg'; }, 5000);
}

function registerSW() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
